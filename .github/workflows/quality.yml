name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.1.9
          install: true
      - name: Install dependencies
        run: mise run install
      - name: Run quality gate
        run: mise run check
