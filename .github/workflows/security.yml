name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest detect
          --source=/repo
          --log-opts=--all
          --redact
          --no-banner
