name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    env:
      # Firebase Web SDK settings are public browser configuration. Prefer
      # GitHub Environment Variables; secrets are accepted as a migration
      # fallback without putting any value in the repository.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_EMULATOR: false
      VITE_FIREBASE_FIRESTORE_EMULATOR: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.1.9
          install: true
      - name: Install dependencies
        run: mise run install
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate production build configuration
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          for variable in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub Pages build variable: ${variable}"
              exit 1
            fi
          done
          echo "GitHub Pages base path: ${VITE_BASE_PATH:-/}"
      - name: Build static SPA
        env:
          # configure-pages returns "/repository" or ""; Vite normalizes it.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: mise run deploy
      - name: Keep SPA entries for direct URLs
        run: |
          set -euo pipefail
          test -s dist/index.html
          cp dist/index.html dist/404.html
          mkdir -p dist/planner
          cp dist/index.html dist/planner/index.html
          test -s dist/404.html
          test -s dist/planner/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
